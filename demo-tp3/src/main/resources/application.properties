spring.application.name=demo
server.port=${PORT:8080}
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=${APP_DUMMYJSON_BASE_URL:https://dummyjson.com}

# Base de datos (ver docker-compose.yml o variables en Render/Railway/Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/webii_tp2}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:webii_tp2}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:webii_tp2}}

# El esquema lo maneja Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
