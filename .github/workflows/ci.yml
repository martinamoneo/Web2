name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: |
          if [ -f "demo-tp3/mvnw" ]; then
            chmod +x demo-tp3/mvnw
          fi
          if [ -f "mvnw" ]; then
            chmod +x mvnw
          fi

      - name: Compile and run tests (Surefire & Failsafe with Testcontainers)
        run: |
          if [ -d "demo-tp3" ]; then
            cd demo-tp3
          fi
          ./mvnw verify -B

      - name: Print test reports on failure
        if: failure()
        run: |
          for f in $(find . -path "*/target/*-reports/*.txt"); do
            echo "==== $f ===="
            cat "$f"
          done

